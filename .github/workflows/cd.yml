name: CD - Publish to npm

on:
  push:
    branches: [main]

concurrency:
  group: cd-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  gates:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release revision for tagging
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Download verified release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tracelattice-release-${{ github.sha }}
          path: ${{ runner.temp }}/tracelattice-release

      - name: Verify checksum
        run: |
          cd "$ARTIFACT_DIR"
          sha256sum --check --strict SHA256SUMS
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/tracelattice-release

      - name: Validate verification receipt
        id: artifact
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/tracelattice-release
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFile, lstat, readFile, readdir } from 'node:fs/promises';
          import { basename, isAbsolute, resolve, sep } from 'node:path';

          const artifactDirectory = process.env.ARTIFACT_DIR;
          const expectedSha = process.env.EXPECTED_SHA;
          const outputFile = process.env.GITHUB_OUTPUT;
          if (!artifactDirectory || !isAbsolute(artifactDirectory)) throw new Error('ARTIFACT_DIR is invalid');
          if (!expectedSha || !/^[0-9a-f]{40}$/.test(expectedSha)) throw new Error('EXPECTED_SHA is invalid');
          if (!outputFile || !isAbsolute(outputFile) || /[\r\n]/.test(outputFile)) throw new Error('GITHUB_OUTPUT is invalid');

          const receiptPath = resolve(artifactDirectory, 'verification.json');
          const receiptStat = await lstat(receiptPath);
          if (!receiptStat.isFile() || receiptStat.size > 1_048_576) throw new Error('verification.json is invalid');
          const receipt = JSON.parse(await readFile(receiptPath, 'utf8'));
          const isRecord = (value) => typeof value === 'object' && value !== null && !Array.isArray(value);
          if (!isRecord(receipt)) throw new Error('receipt must be an object');

          const { tarball, checks, versionCheck, protocolCheck, shutdownCheck, cleanup, manifest } = receipt;
          if (![tarball, checks, versionCheck, protocolCheck, shutdownCheck, cleanup, manifest].every(isRecord)) {
            throw new Error('receipt sections are invalid');
          }
          const version = receipt.version;
          const versionPattern = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/;
          if (receipt.schemaVersion !== 1 || receipt.sourceSha !== expectedSha) throw new Error('receipt sourceSha is invalid');
          if (receipt.name !== '@iworkforces/tracelattice' || typeof version !== 'string' || !versionPattern.test(version)) {
            throw new Error('receipt package identity is invalid');
          }
          if (manifest.name !== receipt.name || manifest.version !== version) throw new Error('receipt manifest is inconsistent');
          if (manifest.main !== 'dist/lib.js' || manifest.types !== 'dist/lib.d.ts') {
            throw new Error('receipt manifest entrypoints are invalid');
          }
          const packageExports = manifest.exports;
          if (!isRecord(packageExports)) throw new Error('receipt manifest.exports is invalid');
          const rootExport = packageExports['.'];
          if (
            !isRecord(rootExport) ||
            rootExport.import !== './dist/lib.js' ||
            rootExport.types !== './dist/lib.d.ts' ||
            packageExports['./package.json'] !== './package.json'
          ) {
            throw new Error('receipt manifest exports are invalid');
          }
          const bin = manifest.bin;
          if (!isRecord(bin) || bin.tracelattice !== './dist/cli.js') {
            throw new Error('receipt manifest bin is invalid');
          }
          const files = manifest.files;
          if (
            !Array.isArray(files) ||
            files.length === 0 ||
            !files.includes('dist') ||
            !files.every(
              (file) =>
                typeof file === 'string' &&
                file.trim() !== '' &&
                !/^(?:[\\/]|[A-Za-z]:)/.test(file) &&
                !/[\r\n]/.test(file) &&
                !file.split(/[\\/]/).includes('..')
            )
          ) {
            throw new Error('receipt manifest files are invalid');
          }
          const packedFiles = receipt.packedFiles;
          const expectedPackedFiles = ['package.json', 'dist/cli.js', 'dist/lib.js', 'dist/lib.d.ts'];
          if (
            !Array.isArray(packedFiles) ||
            !packedFiles.every((file) => typeof file === 'string') ||
            !expectedPackedFiles.every((file) => packedFiles.includes(file))
          ) {
            throw new Error('receipt packedFiles are invalid');
          }

          const entries = await readdir(artifactDirectory);
          const tarballs = entries.filter((entry) => entry.endsWith('.tgz'));
          const expectedBasename = `iworkforces-tracelattice-${version}.tgz`;
          if (tarballs.length !== 1 || tarball.basename !== expectedBasename || tarballs[0] !== expectedBasename) {
            throw new Error('tarball.basename does not match the downloaded .tgz');
          }
          if (basename(tarball.basename) !== tarball.basename || /[\r\n]/.test(tarball.basename)) {
            throw new Error('tarball basename is unsafe');
          }
          const tarballPath = resolve(artifactDirectory, tarball.basename);
          if (!tarballPath.startsWith(`${resolve(artifactDirectory)}${sep}`)) throw new Error('tarball path escaped artifact directory');
          const tarballStat = await lstat(tarballPath);
          if (!tarballStat.isFile() || tarball.size !== tarballStat.size || !Number.isSafeInteger(tarball.size) || tarball.size <= 0) {
            throw new Error('tarball size metadata is invalid');
          }
          if (typeof tarball.sha256 !== 'string' || !/^[0-9a-f]{64}$/.test(tarball.sha256)) {
            throw new Error('tarball.sha256 metadata is invalid');
          }
          const checksum = await readFile(resolve(artifactDirectory, 'SHA256SUMS'), 'utf8');
          if (checksum !== `${tarball.sha256}  ${tarball.basename}\n`) throw new Error('SHA256SUMS metadata is inconsistent');

          if (checks.shebang !== '#!/usr/bin/env bun' || checks.executable !== true) throw new Error('CLI file checks failed');
          if (versionCheck.exitCode !== 0 || versionCheck.output !== `tracelattice v${version}`) throw new Error('versionCheck failed');
          if (protocolCheck.initialize !== true || protocolCheck.toolsList !== true || protocolCheck.validCall !== true || protocolCheck.invalidCall !== true) {
            throw new Error('protocolCheck failed');
          }
          if (shutdownCheck.exitCode !== 0 || shutdownCheck.signal !== null || shutdownCheck.outstandingRequests !== 0) {
            throw new Error('shutdownCheck failed');
          }
          if (cleanup.tempRootsRemoved !== true || cleanup.outputPreserved !== true) throw new Error('cleanup checks failed');

          await appendFile(outputFile, `version=${version}\ntag=v${version}\ntarball=${tarballPath}\n`, 'utf8');
          NODE

      - name: Check if version already published
        id: check
        run: |
          if npm view "@iworkforces/tracelattice@${{ steps.artifact.outputs.version }}" version 2>/dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        id: publish
        if: steps.check.outputs.published == 'false'
        run: npm publish "${{ steps.artifact.outputs.tarball }}" --ignore-scripts --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_KEY }}

      - name: Configure git identity
        if: steps.check.outputs.published == 'false' && steps.publish.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create git tag
        if: steps.check.outputs.published == 'false' && steps.publish.outcome == 'success'
        run: |
          git tag -a "${{ steps.artifact.outputs.tag }}" -m "Release ${{ steps.artifact.outputs.tag }}"
          git push origin "${{ steps.artifact.outputs.tag }}"

      - name: Create GitHub release
        if: steps.check.outputs.published == 'false' && steps.publish.outcome == 'success'
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ steps.artifact.outputs.tag }}
          generate_release_notes: true
